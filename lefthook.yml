# Formatting is deliberately absent until the Plan 2 sweep: a format hook on an unformatted tree
# would rewrite every file it touches, scattering that sweep across unrelated commits.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs}"
      run: pnpm exec oxlint {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b
