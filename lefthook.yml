pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,json,css,md}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs}"
      run: pnpm exec oxlint {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b
